nelmio_cors:
    defaults:
        # Same-origin deployment can keep strict origin; cross-origin must set CORS_ALLOW_ORIGIN explicitly.
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization', 'X-CSRF-Token']
        expose_headers: ['Link']
        max_age: 3600
    paths:
        '^/': null
